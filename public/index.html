<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Car Case</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face { font-family: 'Unbounded'; src: url(fonts/unbounded-500.ttf) format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Unbounded'; src: url(fonts/unbounded-700.ttf) format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-500.ttf) format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Inter'; src: url(fonts/inter-700.ttf) format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; src: url(fonts/corm-600.ttf) format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; src: url(fonts/corm-700.ttf) format('truetype'); font-weight: 700; font-display: swap; }
:root {
  --ink: #131313; --ink2: #1d1d1f; --ivory: #f6f3ec; --brass: #b08d57; --brass-d: #8c6d3f;
  --paper: rgba(255,255,255,.78); --line: rgba(19,19,19,.13); --muted: #6c6a65;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--sans); font-weight: 500; font-size: 14px; color: var(--ink); background: #ece9e2; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
img { -webkit-user-drag: none; }
button { font-family: var(--sans); font-weight: 700; cursor: pointer; }
.hide { display: none !important; }

/* ===== обои: мрамор + машина игрока ===== */
.wall { position: fixed; inset: 0; z-index: -2; background: #ece9e2 url(marble_light.jpg) center / cover; }
.wallcar { position: fixed; z-index: -1; left: 50%; bottom: 96px; width: 150vw; max-width: 980px; transform: translateX(-50%); opacity: .2; pointer-events: none; transition: opacity .8s; }

#app { height: 100%; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.frost { background: var(--paper); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); }

/* ===== шапка ===== */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 12px 0; padding: 9px 12px 9px 10px; background: var(--ink); border: 1px solid var(--brass-d); border-radius: 14px; color: var(--ivory); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg.logo { width: 42px; height: 42px; flex: none; }
.brand .name { font-family: var(--serif); font-weight: 700; font-size: 21px; letter-spacing: .26em; line-height: 1; padding-left: .26em; }
.brand .sub { font-size: 10.5px; letter-spacing: .06em; color: #a39b8a; margin-top: 4px; text-transform: uppercase; }
.bal { display: flex; align-items: center; gap: 8px; border: 1px solid var(--brass-d); border-radius: 999px; padding: 6px 13px 6px 8px; color: var(--brass); font-weight: 700; font-size: 15px; white-space: nowrap; letter-spacing: .02em; }
.bal svg { width: 20px; height: 20px; }
.bal.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.08); } }

main { flex: 1; min-height: 0; position: relative; padding: 14px 12px 104px; }
section.page { height: 100%; display: flex; flex-direction: column; min-height: 0; }
section.in-right { animation: inR .45s cubic-bezier(.2,.9,.3,1) both; } section.in-left { animation: inL .45s cubic-bezier(.2,.9,.3,1) both; }
@keyframes inR { from { opacity: 0; transform: translateX(36px); } } @keyframes inL { from { opacity: 0; transform: translateX(-36px); } }
.pagehead { flex: none; display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; padding-bottom: 8px; border-bottom: 1px solid var(--brass); font-family: var(--serif); font-weight: 700; font-size: 27px; letter-spacing: .12em; text-transform: uppercase; line-height: 1; }
.pagehead small { margin-left: auto; font-family: var(--sans); font-weight: 700; font-size: 11px; letter-spacing: .12em; color: var(--brass-d); }
.pagehead .infobtn { margin-left: 8px; width: 24px; height: 24px; border: 1px solid var(--brass); background: transparent; color: var(--brass-d); border-radius: 50%; padding: 0; display: grid; place-items: center; align-self: center; }
.pagehead .infobtn svg { width: 14px; height: 14px; }

/* ===== рулетка ===== */
.roulette { position: relative; flex: none; height: 158px; border-radius: 16px; overflow: hidden; }
.roulette .ptr { position: absolute; z-index: 3; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--brass); }
.roulette .ptr::before, .roulette .ptr::after { content: ''; position: absolute; left: -6px; border: 6px solid transparent; }
.roulette .ptr::before { top: 0; border-top-color: var(--brass); } .roulette .ptr::after { bottom: 0; border-bottom-color: var(--brass); }
.roulette .shade { position: absolute; z-index: 2; inset: 0; pointer-events: none; box-shadow: inset 34px 0 22px -22px rgba(236,233,226,.95), inset -34px 0 22px -22px rgba(236,233,226,.95); }
.strip { display: flex; height: 100%; align-items: center; will-change: transform; }
.item { position: relative; flex: 0 0 122px; height: 130px; margin: 0 4px; border-radius: 12px; background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px; gap: 5px; transition: transform .35s, box-shadow .35s, border-color .35s; }
.item .pw { width: 104px; height: 56px; }
.item .nm { font-family: var(--serif); font-weight: 700; font-size: 14.5px; line-height: 1; max-height: 29px; overflow: hidden; }
.item .em { position: absolute; left: 6px; top: 6px; width: 20px; height: 20px; }
.item.hit { transform: scale(1.08); border-color: var(--brass); box-shadow: 0 8px 24px rgba(19,19,19,.25); z-index: 3; }

.spinrow { flex: none; display: flex; gap: 10px; margin-top: 12px; }
.btn-main { flex: 1; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--ink); color: var(--ivory); border: 1px solid var(--brass); border-radius: 12px; box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px rgba(176,141,87,.55); text-transform: uppercase; letter-spacing: .2em; font-size: 14px; transition: transform .15s; }
.btn-main .bp { color: var(--brass); letter-spacing: .04em; font-size: 16px; }
.btn-alt { width: 118px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 12px; transition: transform .15s; }
.btn-alt .bl { font-family: var(--serif); font-weight: 700; font-size: 25px; line-height: 1; letter-spacing: .06em; }
.btn-alt .bp { font-size: 12px; letter-spacing: .03em; margin-top: 3px; color: var(--brass-d); }
.btn-main:active:not(:disabled), .btn-alt:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.btn-main:disabled, .btn-alt:disabled { opacity: .38; cursor: default; }
.hint { flex: none; min-height: 18px; text-align: center; color: var(--muted); font-size: 12px; margin: 7px 0 0; }

.seg { flex: none; display: flex; margin: 6px 0 10px; border-bottom: 1px solid var(--line); }
.seg button { flex: 1; padding: 8px 0 9px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; transition: color .25s, border-color .25s; }
.seg button.on { color: var(--ink); border-bottom-color: var(--brass); }
.panel { flex: 1; min-height: 0; overflow: hidden; }
.odds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.odds .o { display: flex; align-items: center; gap: 9px; border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.odds .o .em { width: 26px; height: 26px; flex: none; }
.odds .o .l { font-family: var(--serif); font-weight: 700; font-size: 16px; }
.odds .o b { margin-left: auto; font-size: 13px; color: var(--brass-d); }
.hist { display: flex; flex-direction: column; gap: 6px; }
.hrow { display: flex; align-items: center; gap: 10px; border-radius: 10px; padding: 4px 10px; }
.hrow .pw { width: 62px; height: 32px; flex: none; }
.hrow .n { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .p { font-weight: 700; font-size: 13px; }
.hrow .em { width: 22px; height: 22px; }

/* ===== гараж / каталог ===== */
.chips { flex: none; display: flex; gap: 5px; margin: 0 0 8px; }
.chip { flex: 1; min-width: 0; position: relative; height: 44px; display: grid; place-items: center; padding: 0; background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); transition: background .2s, border-color .2s, transform .2s; }
.chip .em { width: 26px; height: 26px; opacity: .55; transition: opacity .2s; }
.chip svg.ic { width: 20px; height: 20px; }
.chip.on { background: #fff; border-color: var(--ink); color: var(--ink); transform: translateY(-1px); }
.chip.on .em { opacity: 1; }
.chip .cnt { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--ivory); font-size: 10px; line-height: 18px; text-align: center; }
.sumline { flex: none; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sumline b { color: var(--ink); font-size: 14px; letter-spacing: .02em; }
.gridwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; overflow: hidden; }
.grid.flip-n { animation: flipN .35s cubic-bezier(.2,.9,.3,1); } .grid.flip-p { animation: flipP .35s cubic-bezier(.2,.9,.3,1); }
@keyframes flipN { from { opacity: 0; transform: translateX(26px); } } @keyframes flipP { from { opacity: 0; transform: translateX(-26px); } }
.car { position: relative; height: 148px; border-radius: 12px; border-top: 3px solid var(--c); padding: 8px 10px 9px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: transform .2s; }
.car:hover { transform: translateY(-2px); } .car:active { transform: scale(.98); }
.car .em { position: absolute; left: 8px; top: 8px; width: 24px; height: 24px; z-index: 2; }
.car .pw { width: 100%; height: 62px; margin: 4px 0 6px; }
.car .nm { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.02; height: 35px; overflow: hidden; }
.car .pr { margin-top: auto; font-weight: 700; font-size: 14px; letter-spacing: .01em; }
.car .cntb { position: absolute; top: 8px; right: 8px; z-index: 2; background: var(--ink); color: var(--ivory); font-size: 11px; line-height: 1; border-radius: 9px; padding: 3px 7px; }
.car.locked { opacity: .6; } .car.locked .nm { color: var(--muted); }
.car.locked .pw img { filter: brightness(0) opacity(.3); } .car.locked .em { opacity: .45; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding-top: 36px; font-family: var(--serif); font-weight: 700; font-size: 22px; }
.empty svg { width: 64px; height: 64px; display: block; margin: 0 auto 8px; color: var(--brass); }
.pager { flex: none; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 0 0; }
.pager button { width: 42px; height: 34px; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 8px; display: grid; place-items: center; padding: 0; }
.pager button:disabled { opacity: .25; } .pager button svg { width: 18px; height: 18px; }
.pager .dots { display: flex; gap: 6px; align-items: center; min-width: 74px; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
.pager .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(19,19,19,.2); transition: .25s; } .pager .dots i.on { width: 20px; border-radius: 4px; background: var(--brass); }
.prog { flex: none; height: 3px; background: rgba(19,19,19,.14); margin: 0 2px 10px; } .prog i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .6s; }

/* ===== навигация ===== */
.island-wrap { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 10; pointer-events: none; }
.tabs { pointer-events: auto; display: flex; gap: 4px; padding: 5px; background: var(--ink); border: 1px solid var(--brass-d); border-radius: 999px; box-shadow: 0 10px 28px rgba(19,19,19,.35); }
.tabs.jelly { animation: jelly .5s cubic-bezier(.3,1.5,.5,1); } @keyframes jelly { 30% { transform: scale(1.04,.95); } 60% { transform: scale(.99,1.02); } }
.tabs button { position: relative; display: flex; align-items: center; height: 46px; min-width: 50px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #a39b8a; overflow: hidden; transition: background .3s, color .3s, padding .45s cubic-bezier(.34,1.4,.5,1); }
.tabs button svg { flex: none; width: 22px; height: 22px; }
.tabs button .lbl { max-width: 0; opacity: 0; margin-left: 0; white-space: nowrap; font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; transition: max-width .5s cubic-bezier(.34,1.2,.5,1), opacity .25s, margin .35s; }
.tabs button.on { background: var(--brass); color: var(--ink); padding: 0 18px 0 14px; }
.tabs button.on .lbl { max-width: 120px; opacity: 1; margin-left: 9px; }
.tabs button:not(.on):active { background: rgba(255,255,255,.1); }
.tabs .ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: rgba(255,255,255,.3); transform: scale(0); animation: rip .55s ease-out forwards; pointer-events: none; } @keyframes rip { to { transform: scale(6); opacity: 0; } }
.topisland { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; z-index: 90; height: 38px; width: 38px; display: grid; place-items: center; background: var(--ink); color: var(--ivory); border: 1px solid var(--brass); border-radius: 999px; overflow: hidden; opacity: 0; transform: translateX(-50%); pointer-events: none; transition: width .45s cubic-bezier(.34,1.4,.5,1), opacity .2s; }
.topisland.show { opacity: 1; width: var(--w, 180px); }
.topisland span { white-space: nowrap; font-size: 13px; letter-spacing: .06em; opacity: 0; transition: opacity .25s .12s; } .topisland.show span { opacity: 1; }

/* ========= СЦЕНА ВЫИГРЫША / ВИТРИНА (чёрный мрамор) ========= */
.stage { position: fixed; inset: 0; z-index: 50; background: #0c0c0d url(marble_dark.jpg) center / cover; overflow: hidden; color: var(--ivory); animation: stIn .3s ease both; }
.stage.out { animation: stOut .3s ease forwards; } @keyframes stIn { from { opacity: 0; } } @keyframes stOut { to { opacity: 0; } }
.stage > * { position: absolute; }
.st-dim { inset: 0; background: rgba(8,8,9,.55); transition: opacity 1s; }
.stage.show .st-dim, .stage.view .st-dim { opacity: .35; }
.st-cone { left: 50%; top: -6%; width: 150%; height: 80%; margin-left: -75%; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
.stage.show .st-cone, .stage.view .st-cone { opacity: 1; }
.st-beams { left: 50%; top: 42%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; opacity: 0; animation: spinSlow 90s linear infinite; pointer-events: none; }
.stage.show .st-beams, .stage.view .st-beams { opacity: var(--beam, 0); transition: opacity 1.4s; } @keyframes spinSlow { to { transform: rotate(360deg); } }
.st-core { left: 50%; top: 42%; width: 14vmin; height: 14vmin; margin: -7vmin 0 0 -7vmin; border-radius: 50%; background: var(--c); opacity: 0; transform: scale(0); pointer-events: none; }
.stage.pre .st-core { animation: coreIn var(--pre, 1s) cubic-bezier(.5,0,.8,.4) forwards; } @keyframes coreIn { 0% { opacity: 0; transform: scale(.05); } 100% { opacity: 1; transform: scale(var(--coreS, .8)); } }
.stage.beat .st-core { animation: coreIn var(--pre, 1s) linear forwards, heart .8s ease-in-out infinite; } @keyframes heart { 12%, 36% { filter: brightness(1.8); } 0%, 24%, 100% { filter: brightness(1); } }
.stage.burst .st-core { animation: coreBurst .8s cubic-bezier(.2,.8,.2,1) forwards; } @keyframes coreBurst { 0% { opacity: 1; transform: scale(var(--coreS, .8)); } 100% { opacity: 0; transform: scale(12); } }
.st-fx { inset: 0; width: 100%; height: 100%; pointer-events: none; }
.st-flash { inset: 0; background: #fff; opacity: 0; pointer-events: none; } .stage.burst .st-flash { animation: flash .8s ease-out forwards; } @keyframes flash { 0% { opacity: var(--flash, .5); } 100% { opacity: 0; } }
.st-streak { left: 0; right: 0; top: 42%; height: 2px; margin-top: -1px; background: #fff; transform: scaleX(0); opacity: 0; pointer-events: none; }
.stage.burst.has-streak .st-streak { animation: streak 1.2s cubic-bezier(.2,.8,.2,1) forwards; } @keyframes streak { 0% { transform: scaleX(0); opacity: 1; } 35% { opacity: 1; } 100% { transform: scaleX(1.3); opacity: 0; } }
.st-rings { inset: 0; pointer-events: none; }
.st-rings i { position: absolute; left: 50%; top: 42%; width: 46vmin; height: 46vmin; margin: -23vmin 0 0 -23vmin; border-radius: 50%; border: 2px solid var(--c); opacity: 0; }
.stage.burst .st-rings i { animation: ring 1.4s cubic-bezier(.15,.7,.2,1) forwards; animation-delay: calc(var(--n) * .16s); } @keyframes ring { 0% { opacity: .9; transform: scale(.15); } 100% { opacity: 0; transform: scale(3.2); } }
.st-bar { left: 0; right: 0; height: 0; background: #000; z-index: 4; } .st-bar.t { top: 0; } .st-bar.b { bottom: 0; }
.stage.cine .st-bar { animation: barIn .8s cubic-bezier(.2,.8,.2,1) forwards; } .stage.cine.ready .st-bar { animation: barOut .9s ease forwards; }
@keyframes barIn { to { height: 11vh; } } @keyframes barOut { from { height: 11vh; } to { height: 0; } }
.stage.shake1 { animation: shake1 .5s ease-out; } .stage.shake2 { animation: shake2 .8s ease-out; }
@keyframes shake1 { 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(1px, -1px); } }
@keyframes shake2 { 10% { transform: translate(-6px, 4px); } 25% { transform: translate(6px, -4px); } 40% { transform: translate(-5px, 3px); } 55% { transform: translate(4px, -3px); } 70% { transform: translate(-2px, 2px); } 85% { transform: translate(1px, -1px); } }
.scene { left: 0; right: 0; top: 7%; height: 50%; display: flex; align-items: center; justify-content: center; perspective: 1100px; opacity: 0; touch-action: none; transition: transform .7s cubic-bezier(.2,.9,.3,1); }
.stage.show .scene, .stage.view .scene { animation: emerge 1.3s cubic-bezier(.16,1,.3,1) both; } .stage.view .scene { animation-duration: .65s; }
.stage.settled .scene { animation: none; opacity: 1; }
@keyframes emerge { 0% { opacity: 0; transform: translateZ(-500px) scale(.6); filter: blur(16px) brightness(2.6); } 55% { filter: blur(0) brightness(1.3); } 100% { opacity: 1; transform: none; filter: none; } }
.tilt { position: relative; width: min(90vw, 440px); transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); will-change: transform; }
.floor { position: absolute; left: -12%; right: -12%; bottom: -16%; height: 34%; transform: translateZ(-20px); pointer-events: none; }
.floor i { position: absolute; border-radius: 50%; } .floor .d { inset: 0; background: rgba(255,255,255,.05); }
.floor .r1 { inset: 6%; border: 1.5px solid var(--brass); } .floor .r2 { inset: 22% 18%; border: 1px dashed var(--c); opacity: .8; animation: spin 24s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.shadow { position: absolute; left: 1%; right: 1%; bottom: -7%; height: 24%; background: radial-gradient(closest-side, rgba(0,0,0,.9), rgba(0,0,0,.5) 55%, transparent); filter: blur(7px); }
.carbox { position: relative; transform: translateZ(26px); } .carbox img { display: block; width: 100%; height: auto; }
.shine { position: absolute; inset: 0; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.7) 49%, rgba(255,255,255,.15) 53%, transparent 64%); background-size: 320% 100%; background-position: var(--sx, 50%) 0; mix-blend-mode: soft-light; pointer-events: none; }
.reflect { position: absolute; left: 0; right: 0; top: 100%; transform: translateZ(26px) scaleY(-1); transform-origin: 50% 50%; opacity: .4; -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.95), transparent 46%); mask-image: linear-gradient(to top, rgba(0,0,0,.95), transparent 46%); filter: blur(1.2px); pointer-events: none; } .reflect img { display: block; width: 100%; }
.st-info { left: 0; right: 0; bottom: 0; padding: 22px 18px calc(16px + env(safe-area-inset-bottom)); text-align: center; background: rgba(8,8,9,.82); border-top: 1px solid var(--brass-d); opacity: 0; transform: translateY(34px); pointer-events: none; z-index: 5; }
.stage.ready .st-info { opacity: 1; transform: none; pointer-events: auto; transition: opacity .6s, transform .7s cubic-bezier(.2,.9,.3,1); }
.st-new { display: inline-block; background: var(--brass); color: var(--ink); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; padding: 4px 10px; margin-bottom: 8px; border-radius: 3px; }
.st-rar { display: inline-flex; align-items: center; gap: 10px; min-height: 36px; color: var(--c); font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; transition: opacity .3s, transform .3s; opacity: 0; }
.st-rar .em { width: 36px; height: 36px; } .st-rar.swap { opacity: .1 !important; transform: translateY(4px); }
.st-info h2 { margin: 4px 0 0; font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1; opacity: 0; transform: translateY(8px); transition: opacity .6s, transform .6s; }
.stage.ready .st-info h2 { opacity: 1; transform: none; }
.st-price { display: inline-block; font-weight: 700; font-size: 26px; color: var(--brass); margin: 8px 0 12px; letter-spacing: .02em; opacity: 0; transition: opacity .5s; }
.stage.rv .st-rar, .stage.rv .st-price { opacity: 1; } .st-price.done { animation: pricePop .5s cubic-bezier(.3,1.6,.5,1); } @keyframes pricePop { 40% { transform: scale(1.1); } }
.st-tools { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.st-tools button { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--ivory); border: 1px solid #5d5445; border-radius: 999px; padding: 6px 14px 6px 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.st-tools button svg { width: 16px; height: 16px; color: var(--brass); } .stage.sp .st-tools button[data-a=specs] { border-color: var(--brass); background: rgba(176,141,87,.18); }
.st-specs { max-width: 420px; margin: 0 auto; max-height: 0; opacity: 0; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; text-align: left; transition: max-height .6s cubic-bezier(.2,.9,.3,1), opacity .4s, margin .4s; }
.stage.sp .st-specs { max-height: 260px; opacity: 1; margin-bottom: 12px; }
.sp { border: 1px solid #3b362d; background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 11px; } .sp.wide { grid-column: 1 / -1; }
.sp small { display: block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #9d9482; }
.sp em { font-style: normal; font-weight: 700; font-size: 15px; display: block; margin-top: 1px; } .sp.note { border: 0; background: none; padding: 0; text-align: center; }
.sp .bar { display: block; height: 3px; background: #35312a; margin-top: 5px; } .sp .bar b { display: block; height: 100%; background: var(--c); }
.stage.sp .scene { transform: translateY(-12%) scale(.66); }
.st-btns { display: flex; gap: 8px; max-width: 440px; margin: 0 auto; }
.st-btns button { flex: 1; padding: 10px 6px; border: 1px solid #5d5445; border-radius: 10px; background: transparent; color: var(--ivory); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.35; }
.st-btns button.sell { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.st-btns button:active { transform: scale(.98); }
.st-hint { left: 0; right: 0; top: calc(env(safe-area-inset-top) + 16px); text-align: center; font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: #8d8573; opacity: 0; z-index: 5; pointer-events: none; }
.stage.ready .st-hint { opacity: 1; transition: opacity 1s .6s; }
.st-close { right: 14px; top: calc(env(safe-area-inset-top) + 10px); width: 38px; height: 38px; border-radius: 50%; border: 1px solid #5d5445; background: rgba(8,8,9,.6); color: var(--ivory); z-index: 6; display: grid; place-items: center; padding: 0; opacity: 0; pointer-events: none; }
.stage.ready .st-close { opacity: 1; pointer-events: auto; transition: opacity .5s; } .st-close svg { width: 18px; height: 18px; }

/* окна */
.modal { position: fixed; inset: 0; background: rgba(12,12,13,.6); z-index: 80; display: grid; place-items: center; padding: 18px; animation: stIn .25s; }
.sheet { width: 100%; max-width: 400px; max-height: 84vh; background: var(--ivory); border: 1px solid var(--brass); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 26px; letter-spacing: .1em; text-transform: uppercase; }
.sheet p { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
.sheet .list { overflow: auto; font-size: 12px; line-height: 1.4; } .sheet .list > div { padding: 4px 0; border-bottom: 1px solid var(--line); }
.sheet .row { display: flex; gap: 8px; }
.sheet button { flex: 1; padding: 11px 6px; border: 1px solid var(--ink); border-radius: 10px; background: transparent; color: var(--ink); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
.sheet button.pri { background: var(--ink); color: var(--ivory); }
.sum { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.sum .r { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
.sum .r .pw { width: 64px; height: 34px; flex: none; } .sum .r .n { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.05; } .sum .r .n small { display: block; font-family: var(--sans); font-size: 10px; letter-spacing: .12em; color: var(--brass-d); text-transform: uppercase; }
.sum .r .p { font-weight: 700; font-size: 13px; } .sum .r .em { width: 24px; height: 24px; }

.pw { position: relative; flex: none; }
.pw img { position: relative; z-index: 1; display: block; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
.pw::after { content: ''; position: absolute; left: 4%; right: 4%; bottom: -4px; height: 13px; z-index: 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,.22) 60%, transparent); filter: blur(2.5px); }
.hrow .pw::after, .sum .pw::after { height: 8px; bottom: -2px; } .car.locked .pw::after { display: none; }

/* правки по результатам проверки */
.brand .name { font-size: 18px; letter-spacing: .2em; white-space: nowrap; padding-left: .2em; }
.brand .sub { white-space: nowrap; font-size: 9.5px; letter-spacing: .05em; }
.brand > div { min-width: 0; }
.bal { font-size: 14px; padding: 5px 11px 5px 7px; } .bal svg { width: 18px; height: 18px; }
.odds .o { gap: 7px; padding: 7px 8px; } .odds .o .l { font-size: 15px; } .odds .o b { font-size: 12px; } .odds .o .em { width: 24px; height: 24px; }
.wallcar { opacity: .15; }

/* ================= АВТОСАЛОН ================= */
.room { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ceiling { position: absolute; left: 0; right: 0; top: 0; height: 5px; background: #131313; }
.ceiling i { position: absolute; top: 3px; width: 26px; height: 7px; margin-left: -13px; border-radius: 0 0 13px 13px; background: #fffaf0; box-shadow: 0 0 16px 5px rgba(255,246,226,.85); }
.ceiling i:nth-child(1) { left: 10%; } .ceiling i:nth-child(2) { left: 30.5%; } .ceiling i:nth-child(3) { left: 50%; } .ceiling i:nth-child(4) { left: 69.5%; } .ceiling i:nth-child(5) { left: 90%; }
.cones { position: absolute; left: 0; top: 0; width: 100%; height: 82%; filter: blur(12px); }
.cones polygon { fill: rgba(255,250,236,.2); animation: flick 9s ease-in-out infinite; }
.cones polygon:nth-child(2) { animation-delay: -3s; } .cones polygon:nth-child(4) { animation-delay: -6s; }
@keyframes flick { 50% { fill: rgba(255,250,236,.12); } }
.floor { position: absolute; left: -30%; right: -30%; bottom: 0; height: 30%; background: #151517 url(marble_dark.jpg) center / 560px; transform: perspective(420px) rotateX(58deg); transform-origin: 50% 100%; opacity: .9; }
.floor::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,.05); }
.podium { position: absolute; left: 50%; bottom: 92px; width: min(118vw, 600px); transform: translateX(-50%); perspective: 900px; opacity: .42; }
.podium .turn { position: relative; z-index: 1; transform-style: preserve-3d; animation: turn 16s ease-in-out infinite; }
@keyframes turn { 0%, 100% { transform: rotateY(-11deg); } 50% { transform: rotateY(11deg); } }
.room .wallcar { position: relative; left: auto; bottom: auto; width: 100%; max-width: none; transform: none; opacity: 1; display: block; }
.wallrefl { position: absolute; left: 0; top: 100%; width: 100%; transform: scaleY(-1); opacity: .32; -webkit-mask-image: linear-gradient(to top, #000, transparent 45%); mask-image: linear-gradient(to top, #000, transparent 45%); }
.podium .disc { position: absolute; left: -7%; right: -7%; bottom: -8%; height: 24%; border-radius: 50%; background: rgba(255,255,255,.6); border: 1.5px solid rgba(176,141,87,.6); box-shadow: 0 10px 24px rgba(19,19,19,.25); }

/* латунный отблеск на шапке и главной кнопке */
.top { position: relative; overflow: hidden; }
.top::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.1) 50%, transparent 58%); background-size: 260% 100%; animation: glass 10s ease-in-out infinite; }
.btn-main { position: relative; overflow: hidden; }
.btn-main::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(176,141,87,.42) 50%, transparent 60%); background-size: 260% 100%; animation: glass 5.5s ease-in-out infinite; }
@keyframes glass { 0% { background-position: 160% 0; } 35%, 100% { background-position: -60% 0; } }
.pagehead { position: relative; }
.pagehead::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: var(--brass); transform: translateX(-50%) rotate(45deg); }

/* рулетка как витрина: софиты и отражение на глянце */
.roulette { height: 184px; }
.roulette .rcones { position: absolute; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; filter: blur(8px); pointer-events: none; }
.roulette .rcones polygon { fill: rgba(255,250,236,.55); }
.strip { align-items: flex-start; height: 146px; padding-top: 12px; box-sizing: border-box; -webkit-box-reflect: below 2px linear-gradient(transparent 55%, rgba(0,0,0,.32)); }
.item { position: relative; z-index: 2; }

/* карточки-витрины: прожектор, поворотный круг, стеклянный блик */
.car { background: rgba(255,255,255,.7); }
.car::before { content: ''; position: absolute; left: 50%; top: 0; width: 76%; height: 84px; transform: translateX(-50%); clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%); background: rgba(255,248,230,.75); filter: blur(7px); pointer-events: none; }
.car .pw::after { left: 3%; right: 3%; bottom: -7px; height: 17px; border-radius: 50%; background: rgba(255,255,255,.85); border: 1px solid rgba(176,141,87,.85); box-shadow: 0 4px 7px rgba(19,19,19,.22); filter: none; }
.car .gl { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.6) 50%, transparent 60%); background-size: 250% 100%; background-position: 160% 0; animation: glass 7s ease-in-out infinite; animation-delay: var(--d, 0s); }
.car.locked .gl, .car.locked::before { display: none; }

/* ================= ЭЛИТНЫЙ САЛОН: шрифт, подсветка, прозрачные надписи ================= */
:root { --wide: 'Unbounded', 'Inter', Arial, sans-serif; }

.brand .name { font-family: var(--wide); font-weight: 700; font-size: 14px; letter-spacing: .32em; }

.btn-alt .bl { font-family: var(--wide); font-weight: 700; font-size: 20px; }
.tabs button .lbl, .seg button, .st-btns button, .st-tools button, .sheet button { font-family: var(--wide); font-weight: 500; letter-spacing: .14em; font-size: 10.5px; }
.st-info h2 { letter-spacing: .01em; }
.car .pr { font-size: 12.5px; }

/* искусственный свет: LED-линии */
.led { position: absolute; left: 0; right: 0; height: 2px; background: #fff7e6; box-shadow: 0 0 10px 2px rgba(255,240,210,.9), 0 0 32px 6px rgba(255,226,170,.45); animation: ledpulse 6s ease-in-out infinite; }
.led-top { top: 9px; opacity: .85; }
.led-floor { bottom: 11.6%; left: -5%; right: -5%; }
@keyframes ledpulse { 50% { opacity: .7; } }

/* прозрачные надписи на стене салона */
.wallword { position: absolute; left: 50%; top: 23%; transform: translateX(-50%); white-space: nowrap; font-family: var(--wide); font-weight: 700; font-size: 25vw; letter-spacing: .04em; line-height: 1; color: transparent; -webkit-text-stroke: 1.2px rgba(19,19,19,.09); }
.wallside { position: absolute; top: 50%; font-family: var(--wide); font-weight: 500; font-size: 9px; letter-spacing: .5em; color: rgba(19,19,19,.22); white-space: nowrap; }
.wallside.l { left: 6px; transform: translateY(-50%) rotate(-90deg) translateX(0); transform-origin: left center; left: 14px; }
.wallside.r { right: 14px; transform: translateY(-50%) rotate(90deg); transform-origin: right center; }

/* водяной знак раздела */
section.page { position: relative; }
section.page > *:not(.wm) { position: relative; z-index: 1; }
.wm { position: absolute; z-index: 0; left: -2px; top: 30px; pointer-events: none; white-space: nowrap; font-family: var(--wide); font-weight: 700; font-size: 58px; letter-spacing: .02em; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(176,141,87,.32); }

/* номер стенда на витрине */
.car .no { position: absolute; z-index: 1; right: 8px; bottom: 4px; font-family: var(--wide); font-weight: 700; font-size: 34px; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(19,19,19,.16); pointer-events: none; }

/* подсветка витрины снизу и латунная LED-кромка */
.car { box-shadow: inset 0 -2px 0 rgba(176,141,87,.35), 0 6px 18px rgba(19,19,19,.08); }
.roulette { box-shadow: inset 0 -2px 0 rgba(176,141,87,.5), 0 0 0 1px rgba(176,141,87,.25), 0 10px 26px rgba(19,19,19,.1); }

/* подгонка широкого шрифта */
.btn-main { padding: 0 16px; }
.btn-main .bl { font-size: 11.5px; letter-spacing: .2em; }
.btn-main .bp { font-size: 13.5px; }
.btn-alt .bp { font-size: 10.5px; }

.wm { left: auto; right: 0; top: -4px; font-size: 40px; -webkit-text-stroke: 1px rgba(176,141,87,.45); }
</style>
</head>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#131313'); tg.setBackgroundColor('#ece9e2'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch {} }

const RC = { common: '#8d949e', uncommon: '#2f9e5f', rare: '#2f6fd1', epic: '#8a4fd1', legendary: '#c99a2e', mythic: '#c4293d' };
const ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];

const $ = (id) => document.getElementById(id);

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- иконки интерфейса ----------
const IC = {
  spin: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3.5v6.3M12 14.2v6.3M3.5 12h6.3M14.2 12h6.3"/>',

  all: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  prev: '<path d="M15 5l-7 7 7 7"/>', next: '<path d="M9 5l7 7-7 7"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>', close: '<path d="M6 6l12 12M18 6L6 18"/>',
  spec: '<path d="M3 17a9 9 0 1118 0"/><path d="M12 17l4.5-6"/><circle cx="12" cy="17" r="1.2"/>', wall: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/>', coin: '<circle cx="12" cy="12" r="9.5"/><path d="M9.5 17V7h4a2.8 2.8 0 010 5.6h-4M8 14.5h6.5"/>',
};
const svg = (name, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[name]}</svg>`;

// ---------- эмблема Car Case ----------
const LOGO = `<svg class="logo" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="30" fill="#131313" stroke="#b08d57" stroke-width="1.6"/>

  const dust = Array.from({ length: fx.dust }, () => ({ x: Math.random() * W, y: Math.random() * H, s: (.6 + Math.random() * 1.2) * dpr, vy: -(.1 + Math.random() * .25) * dpr, p: Math.random() * 6.28 }));
  const embers = []; let mode = win ? 'pre' : 'idle', tMode = performance.now(), raf = 0, last = performance.now();
  const emberCol = car.rarity === 'mythic' ? ['196,41,61', '240,120,130', '246,243,236'] : ['201,154,46', '244,220,156', '246,243,236'];
  const spawnEmber = () => embers.push({ x: Math.random() * W, y: H + 10, vy: -(.5 + Math.random() * 1.1) * dpr, vx: (Math.random() - .5) * .4 * dpr, s: (.8 + Math.random() * 1.6) * dpr, life: 0, max: 4 + Math.random() * 4, c: emberCol[(Math.random() * 3) | 0], p: Math.random() * 6.28 });

        if (mode === 'pre') { w.r -= w.v * dt * (4 + 36 * k * k) * dpr; if (w.r < 30 * dpr) w.r = (.55 + Math.random() * .6) * Math.hypot(W, H) / 2; } else w.r += w.v * dt * 38 * dpr;
        const a = mode === 'pre' ? (.15 + .75 * k) : Math.max(0, 1 - tm / 700), len = w.l * w.r * (mode === 'pre' ? .6 + k : 1.6); if (a <= 0) continue;
        ctx.strokeStyle = rgba(col, a * .9); ctx.lineWidth = (1 + k * 1.2) * dpr; ctx.beginPath();
        ctx.moveTo(cx + Math.cos(w.a) * w.r, cy + Math.sin(w.a) * w.r); ctx.lineTo(cx + Math.cos(w.a) * (w.r + len), cy + Math.sin(w.a) * (w.r + len)); ctx.stroke();
      }
    }
    if (mode !== 'pre') {
      for (const d of dust) { d.y += d.vy * dt; d.p += .02 * dt; if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; } ctx.fillStyle = `rgba(246,243,236,${.1 + .2 * Math.abs(Math.sin(d.p))})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.s, 0, 6.283); ctx.fill(); }
      if (fx.embers && Math.random() < fx.embers / 700 * dt * 4) spawnEmber();
      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i]; e.life += dt / 60; e.p += .05 * dt; e.x += (e.vx + Math.sin(e.p) * .35 * dpr) * dt; e.y += e.vy * dt;
        const a = Math.min(1, e.life * 2) * Math.max(0, 1 - e.life / e.max); if (a <= 0 || e.y < -10) { embers.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(${e.c},${a * .9})`; ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, 6.283); ctx.fill();
      }
    }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  const tilt = st.querySelector('#tilt'), shine = st.querySelector('.shine'), scene = st.querySelector('.scene');
  let ry = 0, rx = 0, drag = false, px = 0, py = 0, dRy = 0, dRx = 0, ready = false, closed = false, priceRaf = 0;
  scene.addEventListener('pointerdown', (e) => { drag = true; px = e.clientX; py = e.clientY; try { scene.setPointerCapture(e.pointerId); } catch {} });
  scene.addEventListener('pointermove', (e) => { if (!drag) return; dRy = Math.max(-34, Math.min(34, dRy + (e.clientX - px) * .28)); dRx = Math.max(-12, Math.min(12, dRx - (e.clientY - py) * .14)); px = e.clientX; py = e.clientY; });
  const up = () => { drag = false; }; scene.addEventListener('pointerup', up); scene.addEventListener('pointercancel', up);
  const t0 = performance.now(); let raf2 = 0;
  (function anim(now) {
    const t = (now - t0) / 1000; if (!drag) { dRy *= .94; dRx *= .94; }
    ry += (Math.sin(t * .7) * 9 + dRy - ry) * .09; rx += (-2 + Math.cos(t * .5) * 2 + dRx - rx) * .09;
    tilt.style.setProperty('--ry', ry.toFixed(2) + 'deg'); tilt.style.setProperty('--rx', rx.toFixed(2) + 'deg');
    shine.style.setProperty('--sx', (50 - ry * 3.2 + Math.sin(t * .9) * 55).toFixed(1) + '%'); raf2 = requestAnimationFrame(anim);
  })(t0);

  const at = (ms, f) => timers.push(setTimeout(f, ms));
  const burst = () => {
    if (!st.classList.contains('pre')) return;
    st.classList.remove('pre', 'beat'); st.classList.add('burst', 'show'); mode = 'burst'; tMode = performance.now();
    if (fx.shake) st.classList.add('shake' + fx.shake);
    notify('success'); haptic(['epic', 'legendary', 'mythic'].includes(car.rarity) ? 'heavy' : 'medium');
    at(700, () => { mode = 'idle'; }); at(1500, ready1);
  };
  const ready1 = () => { ready = true; st.classList.add('ready', 'settled'); at(win ? 350 : 150, reveal); };
  const reveal = () => {
    if (closed) return;
    const rar = st.querySelector('#stRar'), pr = st.querySelector('#stPrice'), fast = !win;
    const setR = (k) => { rar.style.setProperty('--c', RC[k]); rar.innerHTML = emblem(k) + `<span>${rLabel(k)}</span>`; };
    pr.textContent = fmt(car.price); pr.style.minWidth = pr.offsetWidth + 'px'; pr.textContent = fmt(0);
    const steps = fast ? [car.rarity] : ORDER.slice(0, ORDER.indexOf(car.rarity) + 1);
    setR(steps[0]); st.classList.add('rv');
    const stepMs = steps.length > 1 ? Math.max(230, Math.min(420, 1400 / steps.length)) : 0;
    steps.slice(1).forEach((k, i) => at(500 + stepMs * (i + 1), () => { rar.classList.add('swap'); at(110, () => { setR(k); rar.classList.remove('swap'); haptic('light'); }); }));
    const dur = fast ? 700 : Math.round(1100 + Math.min(1500, Math.log10(car.price) * 190));
    at(500 + stepMs * (steps.length - 1) + 250, () => {
      const t1 = performance.now(); let lastTick = 0;
      const tick = (now) => {
        if (closed) return; const p = Math.min(1, (now - t1) / dur), e = 1 - Math.pow(1 - p, 3);
        pr.textContent = fmt(p >= 1 ? car.price : Math.round(car.price * e));
        if (!fast && p - lastTick > .14 && p < 1) { lastTick = p; haptic('light'); }
        if (p < 1) priceRaf = requestAnimationFrame(tick); else { pr.classList.add('done'); if (!fast) notify('success'); }
      }; priceRaf = requestAnimationFrame(tick);
    });
  };
  if (win) {
    const hs = fx.hap; hs.forEach((h, i) => { if (h !== 'success') at((fx.pre / hs.length) * i, () => haptic(h)); });
    if (fx.beat) [.3, .55, .8].forEach((p) => at(fx.pre * p, () => haptic('heavy')));
    at(fx.pre, burst);
    st.addEventListener('click', (e) => { if (st.classList.contains('pre') && !e.target.closest('button')) { timers.forEach(clearTimeout); burst(); } });
  } else { st.classList.add('show'); mode = 'idle'; at(500, ready1); }

  const close = () => { closed = true; cancelAnimationFrame(priceRaf); cancelAnimationFrame(raf); cancelAnimationFrame(raf2); timers.forEach(clearTimeout); st.classList.add('out'); setTimeout(() => { st.remove(); if (stageEl === st) stageEl = null; o.onClose && o.onClose(sold); }, 300); };
  st.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]'); if (!b || !ready) return; const a = b.dataset.a;
    if (a === 'specs') { st.classList.toggle('sp'); haptic('light'); return; }
    if (a === 'wall') { try { localStorage.setItem('cc_wall', String(car.id)); } catch {} renderWall(); notify('success'); toast('Обои обновлены'); return; }
    if (a === 'keep') return close();
    sold = a === 'sell' || a === 'sellall'; close(); await sell(car.id, a === 'sellall');
  });
}

// ---------- события ----------
$('logoSlot').innerHTML = LOGO; $('coinSlot').innerHTML = svg('coin'); $('credBtn').innerHTML = svg('info');
$('spinBtn').onclick = () => doSpin(1); $('spin5').onclick = () => doSpin(5);
const TABS = ['spin', 'coll', 'cat']; let curTab = 'spin';
document.querySelectorAll('[data-i]').forEach((el) => el.insertAdjacentHTML('afterbegin', svg(el.dataset.i)));
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = (ev) => {
  const t = b.dataset.t; if (t === curTab) return;
  const dir = TABS.indexOf(t) > TABS.indexOf(curTab) ? 'in-right' : 'in-left';
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  TABS.forEach((n) => { const sec = $('tab-' + n); sec.classList.remove('in-right', 'in-left'); sec.classList.toggle('hide', n !== t); });
  const sec = $('tab-' + t); void sec.offsetWidth; sec.classList.add(dir);
  const r = b.getBoundingClientRect(), rp = document.createElement('i'); rp.className = 'ripple';
  rp.style.left = (ev.clientX - r.left) + 'px'; rp.style.top = (ev.clientY - r.top) + 'px'; b.appendChild(rp); setTimeout(() => rp.remove(), 600);
  const bar = $('tabs'); bar.classList.remove('jelly'); void bar.offsetWidth; bar.classList.add('jelly');
  haptic('light'); curTab = t; if (S) { renderColl(); renderCat(); }
});
document.querySelectorAll('#spinSeg button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#spinSeg button').forEach((x) => x.classList.toggle('on', x === b));
  $('odds').classList.toggle('hide', b.dataset.s !== 'odds'); $('hist').classList.toggle('hide', b.dataset.s !== 'hist'); haptic('light');
});
function go(key, d) { const v = view[key], np = v.p + d; if (np < 0) return; v.p = np; (key === 'coll' ? renderColl : renderCat)(d > 0 ? 'flip-n' : 'flip-p'); haptic('light'); }
// колесо мыши листает страницы в гараже и каталоге; стрелки на клавиатуре тоже
let wheelLock = 0;
[['coll', 'tab-coll'], ['cat', 'tab-cat']].forEach(([k, id]) => $(id).addEventListener('wheel', (e) => {
  e.preventDefault(); const now = Date.now(); if (now - wheelLock < 320 || Math.abs(e.deltaY) < 4) return; wheelLock = now;
  const grid = $(k + 'Grid'); const pages = Math.max(1, Math.ceil((k === 'coll' ? new Set(S.cars).size : S.catalog.length) / pageSize(grid))); if (e.deltaY > 0 ? view[k].p < pages - 1 : view[k].p > 0) go(k, e.deltaY > 0 ? 1 : -1);
}, { passive: false }));
document.addEventListener('keydown', (e) => { if (stageEl || !S || curTab === 'spin') return; if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(curTab, 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(curTab, -1); });
async function showCredits() {

  m.innerHTML = `<div class="sheet"><h3>Фото автомобилей</h3><p>Wikimedia Commons, лицензии CC BY / CC BY-SA. Фон удалён, добавлены эффекты.</p><div class="list" id="credList">Загрузка…</div><div class="row"><button>Закрыть</button></div></div>`;
  document.body.appendChild(m); m.onclick = (e) => { if (e.target === m || e.target.tagName === 'BUTTON') m.remove(); };

}
document.addEventListener('click', (e) => {

  else if (t.dataset.pg) { const [k, d] = t.dataset.pg.split(':'); go(k, +d); }
});
let sx = 0, sk = null;
document.addEventListener('touchstart', (e) => { const g = e.target.closest('.grid'); sk = g ? g.id.replace('Grid', '') : null; sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => { if (!sk) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(sk, dx < 0 ? 1 : -1); sk = null; }, { passive: true });

(async () => {

    S = (await api('state')).state;
    const snap = await loadSnap();
    if (snap && snapRev(snap) > (S.rev || 0)) { try { S = (await api('restore', { snap })).state; setTimeout(() => toast('Прогресс восстановлен'), 600); } catch {} }
    renderOdds(); renderAll();
    { const want = new URLSearchParams(location.search).get('tab'); const tb = want && document.querySelector(`.tabs button[data-t="${want}"]`); if (tb && want !== 'spin') tb.onclick({ clientX: 0, clientY: 0 }); }
